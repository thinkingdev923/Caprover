name: Update tooling lockfile

on:
    push:
        branches:
            - chore/modernize-typescript-lint-tooling
        paths:
            - package.json

permissions:
    contents: write

jobs:
    update-lockfile:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: chore/modernize-typescript-lint-tooling
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
            - run: npm install --package-lock-only --ignore-scripts
            - run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package-lock.json
                  git diff --cached --quiet || git commit -m "chore: update tooling lockfile"
                  git push
